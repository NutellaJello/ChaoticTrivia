<!DOCTYPE html>
<html>
<head>
    <title>Chaotic Trivia</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>Alex's Trivia Room</h1>

    <div class = "trivia-question">
        <p>Question 1: Who was the first president of the United States?</p>
    </div>

    <!-- answer text boxes -->
    <!-- essentially label for connects the label to the input text box.
     when the user presses on "your answer", it redirects the focus to the input text box.-->
    <form class = "answer-form">
        <label for ="answer-input">Your Answer:</label>
        <input type="text" id="answer-input" name="answer" required>
    </form>
        

    <!-- you can add more than one class by adding a space -->
    <div class = "players">
        <div class = "player">
            <div class = "player-avatar avatar-red" aria-hidden="true"></div>
            <p>Alex</p>
        </div>
        
        <div class = "player">
            <div class = "player-avatar avatar-purple" aria-hidden="true"></div>
            <p>Jamie</p>
        </div>

        <div class = "player">
            <div class = "player-avatar avatar-green" aria-hidden="true"></div>
            <p>Sam</p>
        </div>

        <div class = "player">
            <div class = "player-avatar avatar-yellow" aria-hidden="true"></div>
            <p>Taylor</p>
        </div>

    </div>



</body>
</html>
